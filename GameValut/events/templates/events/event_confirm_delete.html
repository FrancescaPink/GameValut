{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Elimina Evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'events/delete_style.css' %}" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'core/favicon.png' %}">
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            
            <div class="card card-dark rounded-4">
                <div class="card-body text-center p-5">
                    
                    <div class="mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="#dc3545" class="bi bi-exclamation-triangle-fill" viewBox="0 0 16 16">
                            <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                        </svg>
                    </div>

                    <h2 class="fw-bold mb-2 text-white">Eliminare l'evento?</h2>
                    <p class="text-secondary mb-4">Questa azione è definitiva e non può essere annullata.</p>

                    <div class="event-box p-3 rounded-3 mb-4">
                        <h4 class="fw-bold mb-2 text-title-soft">{{ event.title }}</h4>
                        
                        <div class="text-details-soft">
                            <div class="mb-1">📍 {{ event.location }}</div>
                            <div>🗓️ {{ event.start_date|date:"d M Y, H:i" }}</div>
                        </div>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger btn-lg fw-bold shadow-sm">
                                Si, cancella tutto
                            </button>
                            <a href="{% url 'event_detail' event.pk %}" class="btn btn-cancel py-2">
                                No, torna indietro
                            </a>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
