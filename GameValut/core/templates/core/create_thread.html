<!DOCTYPE html>
<html lang="it">
{% load static %}
<link href="{% static 'core/style.css' %}" rel="stylesheet">
<head>
    <meta charset="UTF-8">
    <title>Nuova Discussione</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Avvia una nuova discussione</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Titolo</label>
                            {{ form.title }} 
                            </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Categoria</label>
                            {{ form.category }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Messaggio</label>
                            {{ form.content }}
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'homepage' %}" class="btn btn-secondary">Annulla</a>
                            <button type="submit" class="btn btn-primary">Pubblica Discussione</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
