{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registrazione - GameValut </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'core/style.css' %}" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'core/favicon.png' %}">
</head>
<body class="d-flex align-items-center justify-content-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="text-center mb-4">
                    <h2 class="text-white">Unisciti alla Community</h2>
                </div>
                
                <div class="card p-4 shadow-lg">
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            
                            {% for field in form %}
                                <div class="mb-3">
                                    <label class="form-label fw-bold">{{ field.label }}</label>
                                    {{ field }}
                                    {% if field.help_text %}
                                        <div class="form-text text-muted small">{{ field.help_text }}</div>
                                    {% endif %}
                                    {% for error in field.errors %}
                                        <div class="text-danger small">{{ error }}</div>
                                    {% endfor %}
                                </div>
                            {% endfor %}

                            <button type="submit" class="btn btn-primary w-100 mt-3 fw-bold">Crea Account</button>
                        </form>
                        
                        <p class="text-center mt-4 mb-0">
                            Hai già un account? <a href="{% url 'login' %}" class="text-success fw-bold">Accedi</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
