{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Login - GamingZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'core/style.css' %}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <h1 class="text-white fw-bold display-5">🎮 GameValut </h1>
                </div>
                
                <div class="card p-4 shadow-lg">
                    <div class="card-body">
                        <h3 class="text-center mb-4 fw-bold">Bentornato</h3>
                        <form method="post">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Username</label>
                                {{ form.username }} 
                                </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Password</label>
                                {{ form.password }}
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fs-5">Accedi</button>
                        </form>
                        
                        <hr class="my-4">
                        
                        <p class="text-center mb-0">
                            Non hai un account? 
                            <a href="{% url 'registration' %}" class="fw-bold text-success">Registrati ora</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
