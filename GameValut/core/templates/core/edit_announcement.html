{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Modifica Annuncio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'core/favicon.png' %}">
    <style>body { background-color: #121212; color: #fff; }</style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card bg-dark text-white border-warning shadow">
                <div class="card-header bg-warning text-dark fw-bold">✏️ Modifica Annuncio</div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold text-warning">{{ field.label }}</label>
                            {{ field }} 
                        </div>
                        {% endfor %}
                        
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a href="{% url 'announcement_detail' announcement.pk %}" class="btn btn-secondary">Annulla</a>
                            <button type="submit" class="btn btn-warning fw-bold">Salva Modifiche</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.querySelectorAll('input, textarea').forEach(e => {
        e.classList.add('form-control');
        e.style.backgroundColor = "#222"; e.style.color = "#fff"; e.style.border = "1px solid #444";
    });
</script>
</body>
</html>
